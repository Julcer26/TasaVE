name: Build Android Debug APK and Release Bundle

on:
  push:
    branches: [ "main", "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create .env from template
      run: cp .env.example .env

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TasaVE-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Publish Direct APK Pre-release (feature branches)
      if: startsWith(github.ref, 'refs/heads/feat/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.ref_name }}" = "feat/v1.2-ultra" ]; then
          TAG="v1.2.0-ultra-test"
          ASSET="TasaVE-v1.2-ultra-test.apk"
          TITLE="Tasa VE v1.2.0 - Prueba Ultra"
          NOTES="APK de prueba para Tasa VE v1.2 Ultra (BCV Hoy/Mañana, COP, Calendario SUDEBAN, Conversor flotante en WhatsApp, Barra Rápida, Notificación fija, Útiles, Carrito con Tarjeta PNG y Cobros)."
        else
          TAG="v1.1.0-scanner-test"
          ASSET="TasaVE-scanner-test.apk"
          TITLE="Tasa VE v1.1.0 - Prueba Escáner"
          NOTES="APK de prueba directa para el escáner de precios con cámara."
        fi
        cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
        gh release delete "$TAG" -y --cleanup-tag || true
        gh release create "$TAG" "$ASSET" \
          --target "${{ github.ref_name }}" \
          --prerelease \
          --title "$TITLE" \
          --notes "$NOTES"
