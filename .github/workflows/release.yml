name: Create GitHub Release with APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create .env template
      run: cp .env.example .env

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: "Tasa VE v1.0.0 Preview"
        body: |
          ### 📱 Tasa VE - APK de Prueba
          Descarga directa para instalar en tu teléfono Android:
          - Anuncio banner superior no invasivo (AdMob Test)
          - Opciones de compra Pro e historial en base de datos local
          - Monitoreo BCV y Binance USDT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
